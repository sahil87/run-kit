# Packaging config for the desktop viewer shell.
# Version is NOT read from package.json (0.0.0 placeholder) — it is injected at
# build time: electron-builder --config.extraMetadata.version=$VERSION
# (see scripts/build-desktop.sh; CI passes the release tag the same way).
appId: ai.shll.run-kit
productName: Run Kit
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - "!dist/**/*.test.js"
mac:
  category: public.app-category.developer-tools
  # Per-arch DMGs (mirrors the rk-darwin-{arm64,amd64} artifact convention);
  # a universal binary would be ~2x the size for no benefit.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Ad-hoc signing only — no Developer ID, no notarization (accepted Gatekeeper
  # "Open Anyway" friction). identity: null makes electron-builder skip signing
  # entirely (it does NOT ad-hoc sign); the afterPack hook applies the ad-hoc
  # signature — arm64 macOS refuses to launch fully unsigned binaries.
  identity: null
win:
  # Unsigned — no Authenticode, mirroring the mac ad-hoc posture (no Developer
  # ID / notarization there): the accepted cost is SmartScreen's "unrecognized
  # app" first-launch dialog on a personal-infra tool. The .ico is derived by
  # electron-builder from build/icon.png; win-arm64 is deferred until demand.
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Development
  # deb requires a maintainer; package.json deliberately carries no author
  # field, so it is set here (noreply address — no personal email in the repo).
  maintainer: sahil87 <sahil87@users.noreply.github.com>
  # AppImage is the zero-install default; deb covers Debian/Ubuntu installs.
  # Linux needs no signing. Icon comes straight from build/icon.png.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
# Mac-only in effect: the hook itself guards on electronPlatformName and
# returns immediately for win/linux packs (no codesign on those hosts).
afterPack: ./after-pack.js
artifactName: "run-kit-desktop-${version}-${arch}.${ext}"
npmRebuild: false
