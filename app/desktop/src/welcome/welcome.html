<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Kit — Connect</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      /* Author `display` rules (label, a#cancel) would otherwise beat the UA
         sheet's `[hidden] { display: none }` — keep the hidden attribute
         authoritative for every element on this page. */
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1117;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
      }
      main.card {
        width: min(420px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #262b36;
        border-radius: 8px;
        background: #131722;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p.tagline {
        margin: 0 0 24px;
        color: #9ca3af;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        color: #9ca3af;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      span.hint {
        text-transform: none;
        letter-spacing: normal;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #2d3340;
        border-radius: 6px;
        background: #0f1117;
        color: #e5e7eb;
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: #34d399;
      }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 10px 12px;
        border: 1px solid #34d399;
        border-radius: 6px;
        background: transparent;
        color: #34d399;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #34d399;
        color: #0f1117;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      p.error {
        margin: 16px 0 0;
        color: #f87171;
      }
      a#cancel {
        display: block;
        margin-top: 16px;
        text-align: center;
        color: #9ca3af;
      }
      /* ── "This Mac" local-daemon section ─────────────────────────────── */
      section#local h2 {
        margin: 0 0 10px;
        color: #9ca3af;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .local-status {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4b5563; /* stopped: grey */
      }
      .dot.running {
        background: #34d399; /* green */
      }
      .dot.starting {
        background: #fbbf24; /* amber */
      }
      p.local-detail {
        margin: 6px 0 0;
        color: #9ca3af;
        font-size: 12px;
      }
      code {
        color: #e5e7eb;
        background: #0f1117;
        border: 1px solid #2d3340;
        border-radius: 4px;
        padding: 1px 5px;
      }
      .local-actions {
        display: flex;
        gap: 8px;
      }
      .local-actions button {
        margin-top: 16px;
      }
      button.ghost {
        border-color: #2d3340;
        color: #9ca3af;
      }
      button.ghost:hover:not(:disabled) {
        background: #2d3340;
        color: #e5e7eb;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0 0;
        color: #6b7280;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-top: 1px solid #262b36;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>run-kit</h1>
      <p id="tagline" class="tagline">Connect to a running <span>rk serve</span> instance.</p>
      <!-- "This Mac" local-daemon section — hidden until the shell reports a
           darwin/linux platform (suppressed on win32); states are driven by
           daemon:status polling in welcome.js. -->
      <section id="local" hidden>
        <h2 id="local-heading">This Mac</h2>
        <div class="local-status" id="local-status-row">
          <span id="local-dot" class="dot"></span>
          <span id="local-status">checking…</span>
        </div>
        <p id="local-detail" class="local-detail"></p>
        <p id="local-hint" class="local-detail" hidden>
          Serve from this machine: <code>brew install sahil87/tap/run-kit</code>
        </p>
        <div class="local-actions">
          <button id="local-connect" type="button" hidden>Connect</button>
          <button id="local-stop" type="button" class="ghost" hidden>Stop</button>
        </div>
        <p id="local-error" hidden class="error"></p>
        <div class="divider">or a remote host</div>
      </section>
      <form id="connect-form">
        <label for="url">Host URL</label>
        <input
          id="url"
          type="text"
          placeholder="http://100.101.2.3:3000"
          autofocus
          spellcheck="false"
          autocomplete="off"
        />
        <!-- No display-name input: the connect flow auto-derives the name
             from the health ping's hostname (origin fallback). -->
        <p id="error" hidden class="error"></p>
        <button id="connect" type="submit">Connect</button>
        <a id="cancel" href="#" hidden>Cancel</a>
      </form>
    </main>
    <script src="./welcome.js"></script>
  </body>
</html>
