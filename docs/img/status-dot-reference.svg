<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <!-- Hues (ref): blue #60a5fa (fab building) · green #9ece6a (fab PR-ready/done)
         yellow #facc15 (ad-hoc agent + waiting halo) · gray #787c99 (floor;
         also the GLYPH's inert token — draft only)
         red #f87171 (failed-center OVERLAY on the DOT; failing AND closed on the
         GLYPH — the ✕ shape tells them apart)
         purple #c084fc (merged — GLYPH ONLY; the dot never renders purple) -->
    <path id="prClosedB" d="M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 5.5a.75.75 0 0 1 .75.75v3.378a2.251 2.251 0 1 1-1.5 0V7.25a.75.75 0 0 1 .75-.75Zm-2.03-5.273a.75.75 0 0 1 1.06 0l.97.97.97-.97a.748.748 0 0 1 1.265.332.75.75 0 0 1-.205.729l-.97.97.97.97a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-.97-.97-.97.97a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l.97-.97-.97-.97a.75.75 0 0 1 0-1.06ZM2.5 3.25a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm9.5 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/>
    <path id="prDraftB" fill-rule="evenodd" d="M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1ZM2.5 3.25a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM12.75 10.5a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5ZM12.75 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM12.75 2.75a1 1 0 1 1 0 2 1 1 0 0 1 0-2ZM12.75 6.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/>
    <path id="prB" d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
  </defs>

  <rect x="0" y="0" width="760" height="680" fill="#1a1b26"/>

  <!-- title -->
  <text x="24" y="30" font-size="16" font-weight="700" fill="#c0caf5">StatusDot — the compositional reference</text>
  <text x="24" y="48" font-size="11" fill="#787c99">No matrix: hue × shape × overlays compose freely. Read hue (which journey), shape (is anyone working), overlays (failed · waiting), glyph (PR).</text>

  <!-- 1 · HUE -->
  <text x="24" y="82" font-size="11" font-weight="700" fill="#787c99">1 · CORE HUE = journey (4)</text>
  <circle cx="40" cy="106" r="5" fill="#60a5fa"/>
  <text x="56" y="110" font-size="12" fill="#c0caf5">FAB · BUILDING</text>
  <text x="220" y="110" font-size="10" fill="#565a73">intake · apply · review — pre-PR work</text>
  <circle cx="40" cy="132" r="5" fill="#9ece6a"/>
  <text x="56" y="136" font-size="12" fill="#c0caf5">FAB · PR-READY / DONE</text>
  <text x="220" y="136" font-size="10" fill="#565a73">ship · review-pr · done — /git-pr creates the PR mid-ship</text>
  <circle cx="40" cy="158" r="5" fill="#facc15"/>
  <text x="56" y="162" font-size="12" fill="#c0caf5">AD-HOC AGENT</text>
  <text x="220" y="162" font-size="10" fill="#565a73">a fresh @rk_agent_state, no fab change</text>
  <circle cx="40" cy="184" r="5" fill="#787c99"/>
  <text x="56" y="188" font-size="12" fill="#c0caf5">FLOOR</text>
  <text x="220" y="188" font-size="10" fill="#565a73">plain terminal — color reserved for a journey</text>
  <line x1="24" y1="206" x2="740" y2="206" stroke="#2f3549" stroke-width="1"/>

  <!-- 2 · SHAPE -->
  <text x="24" y="232" font-size="11" font-weight="700" fill="#787c99">2 · SHAPE = liveness (2 — the same meaning in every hue)</text>
  <circle cx="40" cy="256" r="5" fill="#60a5fa"/>
  <text x="56" y="260" font-size="12" fill="#c0caf5">solid</text>
  <text x="220" y="260" font-size="10" fill="#565a73">work happening NOW — agent mid-turn (PID-reconciled) · floor: output flowing</text>
  <circle cx="40" cy="282" r="5" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="56" y="286" font-size="12" fill="#c0caf5">ring</text>
  <text x="220" y="286" font-size="10" fill="#565a73">at rest — no live worker · idle agent · waiting agent · parked done · quiet shell</text>
  <text x="56" y="308" font-size="10" fill="#565a73">shape source is per-family: journey hues (blue · green · yellow) read agentState ONLY — absent ⇒ ring; the output-flowing fallback is the gray floor's alone</text>
  <text x="56" y="324" font-size="10" fill="#565a73">solid cannot outlive the process (PID-reconciled) — but it is not proof of progress; a wedged-solid is the future stuck overlay's case</text>
  <line x1="24" y1="340" x2="740" y2="340" stroke="#2f3549" stroke-width="1"/>

  <!-- 3 · OVERLAYS -->
  <text x="24" y="366" font-size="11" font-weight="700" fill="#787c99">3 · OVERLAYS = additive flags (2 — over any hue × shape; never a tier, never destructive)</text>
  <circle cx="40" cy="392" r="6" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="40" cy="392" r="2.6" fill="#f87171"/>
  <text x="56" y="396" font-size="12" fill="#c0caf5">failed · at rest</text>
  <text x="220" y="396" font-size="10" fill="#565a73">red center = review / review-pr failed HERE (the only dot-red; fab hues only) — flagged dots keep the 9px footprint</text>
  <circle cx="40" cy="420" r="6" fill="#60a5fa"/>
  <circle cx="40" cy="420" r="4" fill="#1a1b26"/>
  <circle cx="40" cy="420" r="2.6" fill="#f87171"/>
  <text x="56" y="424" font-size="12" fill="#c0caf5">failed · rework live</text>
  <text x="220" y="424" font-size="10" fill="#565a73">over solid the flag cuts a dark gap ring — a bullseye silhouette, so failure is never color alone</text>
  <circle cx="40" cy="448" r="8.5" fill="none" stroke="#facc15" stroke-width="1.6" opacity="0.9"/>
  <circle cx="40" cy="448" r="5" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="56" y="452" font-size="12" fill="#c0caf5">waiting halo</text>
  <text x="220" y="452" font-size="10" fill="#565a73">agent waiting on you — blocked is at rest by definition, so the halo wraps a ring · reduced-motion: static</text>
  <line x1="24" y1="470" x2="740" y2="470" stroke="#2f3549" stroke-width="1"/>

  <!-- 4 · GLYPH -->
  <text x="24" y="496" font-size="11" font-weight="700" fill="#787c99">4 · PR = the right-edge row glyph (one channel, six states — never the dot)</text>
  <g fill="#9ece6a" transform="translate(34,508) scale(0.9)"><use href="#prB"/></g>
  <text x="56" y="519" font-size="10" fill="#565a73">open</text>
  <g fill="#facc15" transform="translate(124,508) scale(0.9)"><use href="#prB"/></g>
  <text x="146" y="519" font-size="10" fill="#565a73">checks running</text>
  <g fill="#f87171" transform="translate(272,508) scale(0.9)"><use href="#prB"/></g>
  <text x="294" y="519" font-size="10" fill="#565a73">checks fail / changes req.</text>
  <g fill="#c084fc" transform="translate(458,508) scale(0.9)"><use href="#prB"/></g>
  <text x="480" y="519" font-size="10" fill="#565a73">merged</text>
  <g fill="#787c99" transform="translate(552,508) scale(0.9)"><use href="#prDraftB"/></g>
  <text x="574" y="519" font-size="10" fill="#565a73">draft</text>
  <g fill="#f87171" transform="translate(632,508) scale(0.9)"><use href="#prClosedB"/></g>
  <text x="654" y="519" font-size="10" fill="#565a73">closed ✕</text>
  <line x1="24" y1="538" x2="740" y2="538" stroke="#2f3549" stroke-width="1"/>

  <!-- Composed examples -->
  <text x="24" y="564" font-size="11" font-weight="700" fill="#787c99">Composes freely — read hue, then shape, then overlays, then glyph:</text>
  <circle cx="52" cy="594" r="5" fill="#60a5fa"/>
  <text x="52" y="618" font-size="9" fill="#565a73" text-anchor="middle">worker building</text>
  <circle cx="146" cy="594" r="6" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="146" cy="594" r="2.6" fill="#f87171"/>
  <text x="146" y="618" font-size="9" fill="#565a73" text-anchor="middle">failed — act</text>
  <circle cx="242" cy="594" r="6" fill="#60a5fa"/>
  <circle cx="242" cy="594" r="4" fill="#1a1b26"/>
  <circle cx="242" cy="594" r="2.6" fill="#f87171"/>
  <text x="242" y="618" font-size="9" fill="#565a73" text-anchor="middle">failed · rework live</text>
  <circle cx="344" cy="594" r="9.5" fill="none" stroke="#facc15" stroke-width="1.6" opacity="0.9"/>
  <circle cx="344" cy="594" r="6" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="344" cy="594" r="2.6" fill="#f87171"/>
  <text x="344" y="618" font-size="9" fill="#565a73" text-anchor="middle">failed · asking</text>
  <circle cx="442" cy="594" r="8.5" fill="none" stroke="#facc15" stroke-width="1.6" opacity="0.9"/>
  <circle cx="442" cy="594" r="5" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="442" y="618" font-size="9" fill="#565a73" text-anchor="middle">intake · asking</text>
  <circle cx="540" cy="594" r="5" fill="none" stroke="#9ece6a" stroke-width="1.8"/>
  <g fill="#c084fc" transform="translate(550,587) scale(0.9)"><use href="#prB"/></g>
  <text x="550" y="618" font-size="9" fill="#565a73" text-anchor="middle">merged · parked</text>
  <circle cx="648" cy="594" r="5" fill="#787c99"/>
  <text x="648" y="618" font-size="9" fill="#565a73" text-anchor="middle">build running</text>
  <circle cx="722" cy="594" r="5" fill="none" stroke="#787c99" stroke-width="1.8"/>
  <text x="722" y="618" font-size="9" fill="#565a73" text-anchor="middle">quiet shell</text>

  <!-- bottom notes -->
  <text x="24" y="648" font-size="10" fill="#565a73">Vocabulary: 4 hues × 2 shapes + 2 overlays + 6 glyph states. Flagged (red-center) dots keep the 9px footprint; failed-over-solid is a bullseye — silhouette, never color alone.</text>
  <text x="24" y="664" font-size="10" fill="#565a73">Dot = local story · glyph = remote story. Journey hues read agentState only (absent ⇒ ring); output is the floor's signal. waiting = ring + halo.</text>
</svg>
